name: Auto Update Berita KOMPAS404

on:
  schedule:
    - cron: '0 6 * * *'  # Setiap jam 6 pagi UTC (jam 1 siang WIB)
  workflow_dispatch:  # Bisa trigger manual

permissions:
  contents: write

jobs:
  update-berita:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate new articles
        run: |
          pip install feedparser
          python3 .github/scripts/news-generator.py
          python3 build-articles.py

      - name: Commit and push
        run: |
          git config user.name "KOMPAS404 Bot"
          git config user.email "bot@kompas404.github.io"
          git add .
          if git diff --staged --quiet; then
            echo "No new articles to commit"
          else
            git commit -m "Auto: update berita $(date +%Y-%m-%d)"
            git push
          fi
